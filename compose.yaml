services:
  falkordb:
    image: falkordb/falkordb:v4.20.7
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      REDIS_ARGS: "--appendonly yes"
    volumes:
      - promisegraph-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  promisegraph-data:
